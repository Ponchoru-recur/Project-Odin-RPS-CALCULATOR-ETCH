<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">First to 5 points wins.</p>

    <div class="scoreboard">
      <div class="score">
        <span class="label">You</span>
        <span id="human-score">0</span>
      </div>
      <div class="score">
        <span class="label">Computer</span>
        <span id="computer-score">0</span>
      </div>
    </div>

    <div class="choices">
      <button class="choice" data-choice="rock">✊<span>Rock</span></button>
      <button class="choice" data-choice="paper">✋<span>Paper</span></button>
      <button class="choice" data-choice="scissors">✌️<span>Scissors</span></button>
    </div>

    <div id="results">
      <p id="round-result">Pick a move to start.</p>
      <p id="final-result"></p>
    </div>

    <button id="reset-btn" hidden>Play Again</button>

    <script src="script.js"></script>
  </body>
</html>
